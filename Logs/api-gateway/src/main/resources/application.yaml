spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
        - id: post-service
          uri: http://post-service:8082
          predicates:
            - Path=/posts/**
        - id: notification-service
          uri: http://notification-service:8083
          predicates:
            - Path=/notifications/**

server:
  port: 8080

logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.example.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
