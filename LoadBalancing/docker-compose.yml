services:
  eureka-server:
    build: .
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - loadbalancing-net

  orderservice-8081:
    build: ./Orderservice
    container_name: orderservice-8081
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
    networks:
      - loadbalancing-net

  orderservice-8082:
    build: ./Orderservice
    container_name: orderservice-8082
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
    networks:
      - loadbalancing-net

  orderservice-8083:
    build: ./Orderservice
    container_name: orderservice-8083
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
    networks:
      - loadbalancing-net

  payment-service:
    build: ./PaymentService
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
      - orderservice-8081
      - orderservice-8082
      - orderservice-8083
    networks:
      - loadbalancing-net

networks:
  loadbalancing-net:
    driver: bridge
