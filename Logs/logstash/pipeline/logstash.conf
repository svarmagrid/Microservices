input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse the application name from the log event (set by Logback)
  if [app_name] {
    mutate {
      add_field => { "service" => "%{app_name}" }
    }
  }

  # Convert log level to uppercase for consistency
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }

  # Add a human-readable timestamp tag
  date {
    match => [ "@timestamp", "ISO8601" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }

  # Also print to stdout for docker-compose logs debugging
  stdout {
    codec => rubydebug
  }
}
