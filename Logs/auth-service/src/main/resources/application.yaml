spring:
  application:
    name: auth-service

server:
  port: 8081

# Logstash host/port - configurable via env vars
logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.example.authservice: DEBUG
