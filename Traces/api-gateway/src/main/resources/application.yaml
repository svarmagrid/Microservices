spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
        - id: post-service
          uri: http://post-service:8082
          predicates:
            - Path=/posts/**
        - id: notification-service
          uri: http://notification-service:8083
          predicates:
            - Path=/notifications/**

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: 1.0       # Gateway propagates B3 trace headers to all upstream services
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.example.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
