spring:
  application:
    name: post-service

server:
  port: 8082

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info

# Feign client configuration - points to auth-service for token validation
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}

logging:
  level:
    root: INFO
    org.example.postservice: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
